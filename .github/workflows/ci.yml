name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build, Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -cover ./...

      - name: Temporarily downgrade Go version for linter
        # golangci-lint fails if the go version in go.mod is newer than what it was built with.
        # This temporarily edits go.mod to bypass the check.
        run: go mod edit -go=1.24

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
          skip-cache: true
