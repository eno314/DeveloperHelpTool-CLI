name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on tag push matching v*, e.g., v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Mac Binary (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Mac Binary
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          BINARY_NAME="developer-help-tool-cli-${{ github.ref_name }}-darwin-arm64"
          go build -v -o $BINARY_NAME ./src
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BINARY_NAME }}
          generate_release_notes: true
